# Presence of this file enables Sonar analysis in s4u/.github workflows
# Used directly for analysis of pull requests from forks by maven-sonar-pr.yml
# Should be consistent with sonar-maven-plugin analysis
sonar.projectKey=org.simplify4u.plugins:pgpverify-maven-plugin
sonar.sources=pom.xml,src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
