version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  # jackson-databind requires jackson-annotations from at least its own line,
  # keep both in one pull request so they can not land out of order
  groups:
    jackson:
      patterns:
      - com.fasterxml.jackson.core:*
    jackson-security:
      applies-to: security-updates
      patterns:
      - com.fasterxml.jackson.core:*
  ignore:
  - dependency-name: org.apache.maven:*
  - dependency-name: org.apache.maven.resolver:*
  # next major requires Java 17, project baseline is Java 8
  - dependency-name: org.junit.jupiter:*
    versions:
    - ">=6.0.0"
  - dependency-name: io.github.resilience4j:*
    versions:
    - ">=2.0.0"
  # Maven 3.x provides slf4j 1.7.x to plugins
  - dependency-name: org.slf4j:*
    versions:
    - ">=2.0.0"
